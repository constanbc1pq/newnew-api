name: Build & push market-router image (dev/market-feature)

on:
  push:
    branches:
      - dev/market-feature
      - market-router-dev
    paths:
      - 'web/**'
      - 'go.mod'
      - 'go.sum'
      - '**.go'
      - 'Dockerfile'
      - '.github/workflows/build-image.yml'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual trigger'
        required: false

jobs:
  build:
    name: Build & push (amd64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute short SHA
        id: sha
        run: echo "value=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Sanitize branch name for tag
        id: branch
        run: |
          # 把 dev/market-feature 这种斜杠转成 dash, 适配 docker tag 规范
          name="${GITHUB_REF_NAME//\//-}"
          echo "value=${name}" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/market-router:latest
            ghcr.io/${{ github.repository_owner }}/market-router:${{ steps.branch.outputs.value }}
            ghcr.io/${{ github.repository_owner }}/market-router:${{ steps.branch.outputs.value }}-${{ steps.sha.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Summary
        run: |
          echo "### Pushed images" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/${{ github.repository_owner }}/market-router:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/${{ github.repository_owner }}/market-router:${{ steps.branch.outputs.value }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/${{ github.repository_owner }}/market-router:${{ steps.branch.outputs.value }}-${{ steps.sha.outputs.value }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Pull on test server" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "docker compose pull new-api" >> $GITHUB_STEP_SUMMARY
          echo "docker compose up -d new-api" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
